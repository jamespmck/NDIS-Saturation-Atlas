<!-- Replace data-tableau-base with the final Tableau Public workbook URL base after publishing. -->
<section
  class="section section-tint"
  data-ndis-tableau
  data-tableau-base="https://public.tableau.com/views/REPLACE_WITH_PUBLISHED_WORKBOOK">
  <div class="container tableau-shell">
    <div class="tableau-setup" data-tableau-setup hidden>
      <p><strong>Publication setup required.</strong> Publish the workbook, then replace the placeholder URL above.</p>
    </div>

    <p class="tableau-status" data-tableau-ready hidden>Select a service area on the atlas to filter the detail dashboard.</p>

    <article class="tableau-panel">
      <h3>Geospatial atlas</h3>
      <div class="tableau-viz-frame">
        <tableau-viz class="tableau-monitor" data-tableau-role="atlas" data-device="monitor" data-view-name="NDISSaturationAtlasMonitor" toolbar="bottom" hide-tabs width="100%" height="940"></tableau-viz>
        <tableau-viz class="tableau-tablet" data-tableau-role="atlas" data-device="tablet" data-view-name="NDISSaturationAtlasTablet" toolbar="bottom" hide-tabs width="100%" height="760"></tableau-viz>
        <tableau-viz class="tableau-phone" data-tableau-role="atlas" data-device="phone" data-view-name="NDISSaturationAtlasPhone" toolbar="bottom" hide-tabs width="100%" height="520"></tableau-viz>
      </div>
    </article>

    <article class="tableau-panel">
      <h3>National summary</h3>
      <div class="tableau-viz-frame">
        <tableau-viz class="tableau-monitor" data-tableau-role="national" data-device="monitor" data-view-name="NDISSaturationNationalMonitor" toolbar="bottom" hide-tabs width="100%" height="1120"></tableau-viz>
        <tableau-viz class="tableau-tablet" data-tableau-role="national" data-device="tablet" data-view-name="NDISSaturationNationalTablet" toolbar="bottom" hide-tabs width="100%" height="1580"></tableau-viz>
        <tableau-viz class="tableau-phone" data-tableau-role="national" data-device="phone" data-view-name="NDISSaturationNationalPhone" toolbar="bottom" hide-tabs width="100%" height="2260"></tableau-viz>
      </div>
    </article>

    <article class="tableau-panel" data-tableau-detail hidden>
      <h3>Service-area detail: <span data-selected-service-area>Select a service area on the atlas</span></h3>
      <div class="tableau-viz-frame">
        <tableau-viz class="tableau-monitor" data-tableau-role="detail" data-device="monitor" data-view-name="NDISSaturationServiceAreaMonitor" toolbar="bottom" hide-tabs width="100%" height="1180"></tableau-viz>
        <tableau-viz class="tableau-tablet" data-tableau-role="detail" data-device="tablet" data-view-name="NDISSaturationServiceAreaTablet" toolbar="bottom" hide-tabs width="100%" height="1780"></tableau-viz>
        <tableau-viz class="tableau-phone" data-tableau-role="detail" data-device="phone" data-view-name="NDISSaturationServiceAreaPhone" toolbar="bottom" hide-tabs width="100%" height="2500"></tableau-viz>
      </div>
    </article>

    <article class="tableau-panel">
      <h3>Opportunities and advocacy</h3>
      <div class="tableau-viz-frame">
        <tableau-viz class="tableau-monitor" data-tableau-role="opportunities" data-device="monitor" data-view-name="NDISSaturationOpportunitiesMonitor" toolbar="bottom" hide-tabs width="100%" height="1280"></tableau-viz>
        <tableau-viz class="tableau-tablet" data-tableau-role="opportunities" data-device="tablet" data-view-name="NDISSaturationOpportunitiesTablet" toolbar="bottom" hide-tabs width="100%" height="1960"></tableau-viz>
        <tableau-viz class="tableau-phone" data-tableau-role="opportunities" data-device="phone" data-view-name="NDISSaturationOpportunitiesPhone" toolbar="bottom" hide-tabs width="100%" height="2760"></tableau-viz>
      </div>
    </article>
  </div>
</section>

<script type="module" src="/assets/js/ndis-tableau.js"></script>
